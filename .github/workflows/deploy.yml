name: Trigger Blog Deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy in jekyll-blog
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/JimmyLv/jekyll-blog/dispatches \
            -d '{"event_type":"submodule-update"}'
